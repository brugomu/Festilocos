name: Construir APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Compilar
        run: gradle assembleDebug --no-daemon

      - name: Renombrar APK
        run: cp app/build/outputs/apk/debug/app-debug.apk Festilocos.apk

      - uses: actions/upload-artifact@v4
        with:
          name: apk
          path: Festilocos.apk

      - name: Publicar en Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Festilocos (versión ${{ github.run_number }})
          body: Tocá Festilocos.apk para descargarlo e instalarlo en el celular.
          files: Festilocos.apk

  # opens the APK on an Android emulator and saves screenshots and logs, to catch problems before the phone does
  probar:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: apk

      - name: Activar KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Probar en emulador
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 33
          arch: x86_64
          target: google_apis
          disable-animations: true
          script: |
            adb install -r Festilocos.apk
            adb logcat -c
            adb shell am start -n com.festilocos.juego/.MainActivity
            sleep 20
            adb exec-out screencap -p > pantalla1.png
            SIZE=$(adb shell wm size | tail -1 | sed 's/.*: //'); W=${SIZE%x*}; H=${SIZE#*x}; if [ $W -lt $H ]; then T=$W; W=$H; H=$T; fi
            adb shell input swipe $((W*50/100)) $((H*85/100)) $((W*50/100)) $((H*10/100)) 400
            sleep 2
            adb exec-out screencap -p > pantalla2.png
            adb shell input tap $((W*20/100)) $((H*80/100))
            sleep 6
            adb exec-out screencap -p > pantalla3.png
            adb logcat -d > logcat.txt || true

      - name: Guardar resultados de la prueba
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          grep -E "FESTI|AndroidRuntime|FATAL|chromium|renderer|WebView" logcat.txt | tail -300 > resumen.txt || true
          gh release upload build-${{ github.run_number }} pantalla1.png pantalla2.png pantalla3.png resumen.txt --clobber -R ${{ github.repository }}
