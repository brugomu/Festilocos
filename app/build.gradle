plugins { id "com.android.application" }

android {
    namespace "com.festilocos.juego"
    compileSdk 34
    defaultConfig {
        applicationId "com.festilocos.juego"
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName "0.1"
    }
    buildTypes {
        release { minifyEnabled false }
    }
    packaging {
        resources { excludes += ["META-INF/*"] }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    // tiny WebSocket server so friends on the same Wi-Fi can join the host's game
    implementation "org.java-websocket:Java-WebSocket:1.5.7"
}
